<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsletter-Dashboard BdKEP</title>
</head>
<body>
  <h1>Newsletter-Dashboard BdKEP</h1>
  <p id="status">Lade Status …</p>
  <script>
    fetch("/api/status").then(r => r.json()).then(s => {
      document.getElementById("status").textContent =
        "Gerüst läuft. Texterzeugung per API: " + (s.api_schluessel_vorhanden ? "verfügbar" : "nicht aktiv (kein ANTHROPIC_API_KEY)");
    });
  </script>
</body>
</html>
