<title>Newsletter BdKEP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Gestaltung nach der Vorlage "Newsletter-Dashboard": Navy-Kopf, Kennzahlenleiste, links Eingangskorb, rechts die Ausgaben.
   Eckige Flächen mit 1-px-Rand, keine Schatten, Radius 2 px, Schaltflächen 44 px hoch. Nur helles Erscheinungsbild wie die Vorlage. */
:root{
  --navy:#002F6C; --gold:#D6A42E; --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1B2432; --muted:#566070; --line:#D5DAE1; --on-navy:#DCE6F2;
  --warn-bg:#FFF6DD; --warn-line:#D6A42E; --warn-ink:#4A3608; --crit-bg:#FBE9E7; --crit-line:#B3261E; --crit-ink:#7A1A14;
  --sans:'Open Sans',Arial,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:hover{filter:brightness(.9)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.page{max-width:1440px;margin:0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.kopf{background:var(--navy);color:#fff;padding-block:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.over{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
h1{margin:4px 0 0;font-size:30px;font-weight:800;line-height:1.2}
.sub{margin:8px 0 0;font-size:14px;color:var(--on-navy)}
.kopf img{display:block;height:56px;width:auto}
.kpis{display:flex;flex-wrap:wrap;gap:16px;padding-top:24px}
.kpi{flex:1 1 200px;background:var(--surface);border:1px solid var(--line);padding:16px 20px}
.kpi .v{font-size:32px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:24px 40px;align-items:flex-start}
.links{flex:1 1 640px;min-width:0;background:var(--surface);border:1px solid var(--line)}
.rechts{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.sec-head{padding:20px 24px;border-bottom:1px solid var(--line)}
.sec-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h2{margin:0;font-size:20px;font-weight:800;color:var(--navy)}
.muted{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{min-height:44px;padding:0 16px;border-radius:2px;font-size:14px;font-weight:600;background:var(--surface);color:var(--navy);border:1px solid var(--navy)}
.btn.on,.btn.primary{background:var(--navy);color:#fff}
.btn.danger{color:var(--crit-ink);border-color:var(--crit-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.abruf{margin-top:16px;padding:12px 16px;background:var(--bg);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px}
.abruf b{color:var(--navy);font-weight:700}
.liste{padding:20px 24px;display:flex;flex-direction:column;gap:12px;max-height:880px;overflow-y:auto}
article.k{border:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.zeile{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nr{font-size:12px;font-weight:700;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:2px 8px}
.k h3{margin:0;font-size:16px;font-weight:700;color:var(--navy);line-height:1.35;overflow-wrap:anywhere}
.k p{margin:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.warn{font-size:13px;line-height:1.45;padding:8px 12px}
.warn.warn-k{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
.warn.crit{background:var(--crit-bg);border:1px solid var(--crit-line);color:var(--crit-ink)}
.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.knoepfe{display:flex;flex-wrap:wrap;gap:8px}
pre.volltext{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);padding:10px 12px;font:13px/1.5 var(--sans);margin:0;max-height:360px;overflow:auto}
.feld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-height:44px;max-width:100%;width:100%}
textarea{min-height:96px;resize:vertical}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.raster .breit{grid-column:1/-1}
.formular{margin:20px 24px 0;padding:16px 20px;border:1px solid var(--navy);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.ausgabe{background:var(--surface);border:1px solid var(--line)}
.ausgabe .kopf2{background:var(--navy);color:#fff;padding:16px 24px}
.ausgabe h2{color:#fff;font-size:18px}
.ausgabe .kopf2 .muted{color:var(--on-navy);margin-top:4px}
.ausgabe .inhalt{padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.pos{border:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.pos .t{font-size:15px;font-weight:700;color:var(--navy);line-height:1.35;overflow-wrap:anywhere}
.leer{margin:0;font-size:14px;color:var(--muted)}
.hinweis-fuss{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;font-size:14px;max-width:90vw;border-left:4px solid var(--gold)}
@media (max-width:520px){.sec-head,.liste,.ausgabe .inhalt{padding-left:16px;padding-right:16px}.formular{margin-left:16px;margin-right:16px}.ausgabe .kopf2{padding-left:16px;padding-right:16px}}
</style>
<div class="page" id="app"></div>
<script>
const LOGO_D='__LOGO_D__';
const SRC={mail:{l:'Mail',s:'background:#F6E7BF;color:#5A4310'},document:{l:'Datei',s:'background:#DCE6F2;color:#002F6C'},link:{l:'Web',s:'background:#E8EBEF;color:#2B3440'},note:{l:'Notiz',s:'background:#EDE6F2;color:#3B2A52'},image:{l:'Bild',s:'background:#E8EBEF;color:#2B3440'}};
const STATUS={vorschlag:'Vorschlag',kandidat:'Offener Kandidat',beobachtung:'Beobachtung'};
const RANK={vorschlag:0,kandidat:1,beobachtung:2};
const fmtD=new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Berlin'});
const fmtT=new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Europe/Berlin'});

  for(const k in (attrs||{})){const v=attrs[k];if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='class')e.className=v;else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}

let db=null,canWrite=null,items=[],ausgaben=[],loaded=false,filter='alle',showNew=false,newTyp='note',newIssue=false,toastMsg='',toastT=0,busy=false;
const openIds=new Set(),delIds=new Set(),drafts={};
function toast(m,ms){toastMsg=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{toastMsg='';render()},ms||3500)}
const status=c=>STATUS[c.status]?c.status:'vorschlag';
const ausgabeId=c=>c.ausgabe||'';
const inAusgabe=id=>items.filter(c=>ausgabeId(c)===id).sort((a,b)=>(a.position||0)-(b.position||0));
const schreiben=async(fn,okMsg)=>{
  if(!db)return toast('Die Datenbank ist nicht erreichbar.');
  if(busy)return false;busy=true;
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){toast('Speichern nicht möglich'+(e&&e.code==='invalid_argument'?': keine Schreibrechte.':'.'));return false}
  finally{busy=false}
};
const upd=(c,patch,msg)=>schreiben(()=>db.doc('quellen/'+c.id).update(patch),msg);
const zuordnen=(c,id)=>{const pos=Math.max(0,...inAusgabe(id).map(x=>x.position||0))+1;return upd(c,{ausgabe:id,position:pos},'Der Ausgabe zugeordnet.')};
const freigeben=c=>upd(c,{ausgabe:'',position:0},'Zurück im Eingangskorb.');
async function hoch(c){
  const l=inAusgabe(ausgabeId(c)),i=l.findIndex(x=>x.id===c.id);if(i<1)return;
  const a=l[i],b=l[i-1];
  await schreiben(async()=>{const pa=i,pb=i-1;await db.doc('quellen/'+a.id).update({position:pb+1});await db.doc('quellen/'+b.id).update({position:pa+1})});
}
async function neueQuelle(f){
  const titel=f.titel.trim(),text=f.text.trim();
  if(!titel&&!text&&!f.url)return toast('Bitte Titel, Text oder Link eintragen.');
  const id='h-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const ok=await schreiben(()=>db.doc('quellen/'+id).set({typ:f.typ,titel:titel||f.url||text.slice(0,60),text,url:f.url||'',mailBetreff:f.betreff||'',mailAbsender:f.absender||'',mailDatum:f.datum||'',quelle:'hand',erfasstAm:new Date().toISOString(),erfasstVon:'Dashboard',status:'vorschlag',ausgabe:'',position:0}),'Quelle liegt im Eingangskorb.');
  if(ok){showNew=false;['t','u','b','a','d','x'].forEach(k=>delete drafts['neu.'+k]);render()}
}
async function neueAusgabe(){
  const name=(drafts['ausg.name']||'').trim();if(!name)return toast('Bitte einen Namen eintragen, z. B. „Januar 2027“.');
  const id='a-'+Date.now().toString(36);
  const ok=await schreiben(()=>db.doc('ausgaben/'+id).set({name,reihenfolge:Date.now(),angelegtAm:new Date().toISOString()}),'Ausgabe angelegt.');
  if(ok){newIssue=false;delete drafts['ausg.name'];render()}
}
const loeschen=c=>schreiben(async()=>{await db.doc('quellen/'+c.id).delete();delIds.delete(c.id);openIds.delete(c.id)},'Quelle gelöscht.');
function parseEml(raw){
  const [head,...rest]=raw.replace(/\r\n/g,'\n').split('\n\n');
  const hd=n=>{const m=head.match(new RegExp('^'+n+':\\s*([^\\n]*(?:\\n[ \\t][^\\n]*)*)','im'));return m?m[1].replace(/\n\s+/g,' ').trim():''};
  return{betreff:hd('Subject'),absender:hd('From'),datum:hd('Date'),text:rest.join('\n\n').trim()};
}
const kurz=(t,n)=>{t=(t||'').replace(/\s+/g,' ').trim();if(t.length<=n)return t;let k=t.slice(0,n),c=k.lastIndexOf(' ');return (c>n*.7?k.slice(0,c):k)+' …'};
const metaText=c=>c.typ==='mail'?[c.mailAbsender?'Von '+c.mailAbsender:'',c.mailDatum?'am '+(dat(c.mailDatum,true)||c.mailDatum):''].filter(Boolean).join(' · ')||'Mail':
  c.typ==='link'?(c.url||'Link'):'Erfasst '+dat(c.erfasstAm);

function formular(){
  const dk=(k,d)=>drafts['neu.'+k]!==undefined?drafts['neu.'+k]:d;
  const set=k=>e=>{drafts['neu.'+k]=e.target.value};
  const fld=(id,lab,k,type)=>{const i=h('input',{id,type:type||'text',oninput:set(k)});i.value=dk(k,'');return h('label',{class:'feld'},lab,i)};
  const ty=h('select',{id:'n-typ',onchange:e=>{newTyp=e.target.value;render()}},['note','link','mail','document'].map(k=>h('option',{value:k,selected:k===newTyp},SRC[k].l)));
  const tx=h('textarea',{id:'n-text',oninput:set('x'),placeholder:newTyp==='mail'?'Mailtext einfügen':newTyp==='link'?'Beschreibung oder Haupttext (optional)':'Text'});tx.value=dk('x','');
  const file=h('input',{id:'n-file',type:'file',accept:'.txt,.md,.eml',onchange:async e=>{
    const f=e.target.files[0];if(!f)return;const raw=await f.text();
    if(/\.eml$/i.test(f.name)){const m=parseEml(raw);Object.assign(drafts,{'neu.b':m.betreff,'neu.a':m.absender,'neu.d':m.datum,'neu.x':m.text,'neu.t':m.betreff||f.name});newTyp='mail'}
    else{drafts['neu.x']=raw;drafts['neu.t']=f.name;newTyp='document'}render()}});
  const read=()=>({typ:newTyp,titel:dk('t',''),url:dk('u',''),betreff:dk('b',''),absender:dk('a',''),datum:dk('d',''),text:dk('x','')});
  return h('div',{class:'formular'},h('h2',{},'Quelle erfassen'),
    h('div',{class:'raster'},h('label',{class:'feld'},'Art',ty),fld('n-titel','Titel','t'),newTyp==='link'?fld('n-url','Adresse (URL)','u','url'):null,
      newTyp==='mail'?[fld('n-betreff','Betreff','b'),fld('n-abs','Absender','a'),fld('n-datum','Datum der Mail','d')]:null,
      h('label',{class:'feld breit'},'Text',tx),h('label',{class:'feld breit'},'Datei lesen (.txt, .md, .eml)',file)),
    h('div',{class:'knoepfe'},h('button',{class:'btn primary',type:'button',onclick:()=>neueQuelle(read())},'In den Eingangskorb'),h('button',{class:'btn',type:'button',onclick:()=>{showNew=false;render()}},'Abbrechen')));
}
const warnBox=c=>c.hinweisText?h('div',{class:'warn '+(c.hinweisArt==='crit'?'crit':'warn-k')},h('strong',{},'Hinweis:'),' '+c.hinweisText):null;

function karte(c){
  const s=SRC[c.typ]||SRC.note,isOpen=openIds.has(c.id),flip=()=>{isOpen?openIds.delete(c.id):openIds.add(c.id);render()};
  const neu=c.quelle==='mail'&&!c.ausgabe&&status(c)==='vorschlag';
  const el=h('article',{class:'k'});
  el.append(h('div',{class:'zeile'},h('span',{class:'badge',style:s.s},s.l),c.quelle==='mail'?h('span',{class:'muted'},'per Mailabruf'):null,h('span',{class:'muted'},STATUS[status(c)]+(neu?' · neu':'')),h('span',{class:'muted',style:'margin-left:auto'},'erfasst '+dat(c.erfasstAm))));
  el.append(h('h3',{},c.titel||'Ohne Titel'));
  if(c.text)el.append(h('p',{},isOpen?'':kurz(c.text,240)));
  const w=warnBox(c);if(w)el.append(w);
  el.append(h('div',{class:'meta'},metaText(c)));
  if(isOpen){
    if(c.text)el.querySelector('p').replaceWith(h('pre',{class:'volltext'},c.text));
    if(c.url)el.append(h('a',{href:c.url,target:'_blank',rel:'noopener noreferrer',style:'font-size:13px;color:var(--navy)'},'Link öffnen'));
    if(canWrite!==false){
      const dk=(k,d)=>drafts[c.id+'.'+k]!==undefined?drafts[c.id+'.'+k]:d,set=k=>e=>{drafts[c.id+'.'+k]=e.target.value};
      const ti=h('input',{id:'e-t-'+c.id,oninput:set('t')});ti.value=dk('t',c.titel||'');
      const st=h('select',{id:'e-s-'+c.id,onchange:set('s')},Object.keys(STATUS).map(k=>h('option',{value:k,selected:k===dk('s',status(c))},STATUS[k])));
      const ha=h('select',{id:'e-a-'+c.id,onchange:set('a')},[['','Kein Hinweis'],['warn','Hinweis'],['crit','Frist oder Termin vorbei']].map(([k,l])=>h('option',{value:k,selected:k===dk('a',c.hinweisArt||'')},l)));
      const ht=h('textarea',{id:'e-h-'+c.id,style:'min-height:64px',oninput:set('h')});ht.value=dk('h',c.hinweisText||'');
      el.append(h('div',{class:'raster'},h('label',{class:'feld breit'},'Titel',ti),h('label',{class:'feld'},'Status',st),h('label',{class:'feld'},'Hinweisart',ha),h('label',{class:'feld breit'},'Hinweistext (z. B. abgelaufene Frist, offene Prüfung)',ht)),
        h('div',{class:'knoepfe'},h('button',{class:'btn',type:'button',onclick:async()=>{
          const ok=await upd(c,{titel:(dk('t',c.titel)||'').trim()||c.titel,status:dk('s',status(c)),hinweisArt:dk('a',c.hinweisArt||''),hinweisText:(dk('h',c.hinweisText||'')||'').trim()},'Gespeichert.');
          if(ok)['t','s','a','h'].forEach(k=>delete drafts[c.id+'.'+k])}},'Änderungen speichern')));
    }
  }
  if(canWrite!==false&&status(c)!=='beobachtung'){
    el.append(h('div',{class:'knoepfe'},ausgaben.map(a=>h('button',{class:'btn',type:'button',onclick:()=>zuordnen(c,a.id)},'In Ausgabe '+a.name.replace(/\s*\d{4}$/,'')))));
  }else if(status(c)==='beobachtung')el.append(h('div',{class:'muted'},'Beobachtung, kein Newsletterthema.'));
  el.append(h('div',{class:'knoepfe'},h('button',{class:'btn',type:'button','aria-expanded':String(isOpen),onclick:flip},isOpen?'Weniger anzeigen':'Details'),
    canWrite===false?null:delIds.has(c.id)?[h('button',{class:'btn danger',type:'button',onclick:()=>loeschen(c)},'Wirklich löschen'),h('button',{class:'btn',type:'button',onclick:()=>{delIds.delete(c.id);render()}},'Abbrechen')]:
      h('button',{class:'btn danger',type:'button',onclick:()=>{delIds.add(c.id);render()}},'Löschen')));
  return el;
}
function ausgabePanel(a){
  const l=inAusgabe(a.id),warnN=l.filter(x=>x.hinweisText).length;
  return h('div',{class:'ausgabe'},
    h('div',{class:'kopf2'},h('h2',{},'Ausgabe '+a.name),h('div',{class:'muted'},l.length+(l.length===1?' Thema':' Themen')+' · '+warnN+' mit Hinweis')),
    h('div',{class:'inhalt'},
      !l.length?h('p',{class:'leer'},'Noch keine Themen zugeordnet. Im Eingangskorb „In Ausgabe '+a.name.replace(/\s*\d{4}$/,'')+'“ wählen.'):null,
      l.map((c,i)=>{const s=SRC[c.typ]||SRC.note;return h('div',{class:'pos'},
        h('div',{class:'zeile'},h('span',{class:'nr'},'Position '+(i+1)),h('span',{class:'badge',style:s.s},s.l)),
        h('div',{class:'t'},c.titel||'Ohne Titel'),warnBox(c),
        canWrite===false?null:h('div',{class:'knoepfe'},
          h('button',{class:'btn',type:'button',disabled:i===0,onclick:()=>hoch(c)},'Nach oben'),
          h('button',{class:'btn',type:'button',onclick:()=>freigeben(c)},'Zurück in den Eingangskorb')))})));
}
function render(){
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart,sc=document.querySelector('.liste'),st=sc?sc.scrollTop:0;
  const app=document.getElementById('app');app.textContent='';
  const echte=items.filter(c=>status(c)!=='beobachtung'),unz=items.filter(c=>!ausgabeId(c));
  const mails=items.filter(c=>c.quelle==='mail').map(c=>c.erfasstAm).sort(),letzter=mails.length?dat(mails[mails.length-1],true):'noch kein Abruf';
  const count=fn=>unz.filter(fn).length;
  const chips=[['alle','Alle ('+unz.length+')'],['mail','Mail ('+count(c=>c.typ==='mail')+')'],['document','Datei ('+count(c=>c.typ==='document')+')'],['link','Web ('+count(c=>c.typ==='link')+')'],['note','Notiz ('+count(c=>c.typ==='note')+')'],['beobachtung','Beobachtung ('+count(c=>status(c)==='beobachtung')+')']];
  const shown=unz.filter(c=>filter==='alle'||(filter==='beobachtung'?status(c)==='beobachtung':c.typ===filter)).sort((x,y)=>RANK[status(x)]-RANK[status(y)]||(y.erfasstAm||'').localeCompare(x.erfasstAm||''));
  const kp=[[echte.filter(c=>!ausgabeId(c)).length,'Im Eingangskorb'],[echte.filter(c=>ausgabeId(c)).length,'Einer Ausgabe zugeordnet'],[echte.filter(c=>c.hinweisText).length,'Themen mit Hinweis'],[items.filter(c=>status(c)==='beobachtung').length,'In Beobachtung']];
  app.append(
    h('header',{class:'kopf gutter'},h('div',{},h('div',{class:'over'},'Newsletter-Redaktion'),h('h1',{},'Themen sammeln, Ausgaben planen'),h('p',{class:'sub'},'Stand '+dat(new Date().toISOString())+' · Daten aus dem Themenspeicher')),h('img',{src:LOGO_D,alt:'BdKEP'})),
    h('section',{class:'kpis gutter'},kp.map(([v,l])=>h('div',{class:'kpi'},h('div',{class:'v'},String(v)),h('div',{class:'l'},l)))),
    h('main',{class:'gutter'},
      h('section',{class:'links'},
        h('div',{class:'sec-head'},
          h('div',{class:'sec-top'},h('h2',{},'Eingangskorb'),h('span',{class:'muted'},shown.length+(shown.length===1?' Eintrag':' Einträge')+' in dieser Ansicht')),
          h('div',{class:'chips',role:'group','aria-label':'Filter'},chips.map(([k,t])=>h('button',{class:'btn'+(filter===k?' on':''),type:'button','aria-pressed':String(filter===k),onclick:()=>{filter=k;render()}},t)),
            canWrite===false?null:h('button',{class:'btn primary',type:'button',style:'margin-left:auto',onclick:()=>{showNew=!showNew;render()}},'Quelle erfassen')),
          h('div',{class:'abruf'},h('b',{},'Mailabruf'),h('span',{},'Postfach: aschumann.bdkep+news@gmail.com'),h('span',{},'Täglich um 23:45 Uhr'),h('span',{},'Letzter Abruf: '+letzter))),
        showNew?formular():null,
        h('div',{class:'liste'},
          !loaded?h('p',{class:'leer'},'Lade Eingangskorb …'):null,
          loaded&&!shown.length?h('p',{class:'leer'},items.length?'Keine Einträge in dieser Ansicht.':'Der Eingangskorb ist leer. Erfasse eine Quelle oder warte auf den nächsten Mailabruf.'):null,
          shown.map(karte))),
      h('section',{class:'rechts'},
        ausgaben.map(ausgabePanel),
        !ausgaben.length&&loaded?h('p',{class:'leer'},'Noch keine Ausgabe angelegt.'):null,
        canWrite===false?null:newIssue?h('div',{class:'formular',style:'margin:0'},h('label',{class:'feld'},'Name der Ausgabe',h('input',{id:'ausg-name',value:drafts['ausg.name']||'',placeholder:'z. B. Januar 2027',oninput:e=>{drafts['ausg.name']=e.target.value}})),
          h('div',{class:'knoepfe'},h('button',{class:'btn primary',type:'button',onclick:neueAusgabe},'Ausgabe anlegen'),h('button',{class:'btn',type:'button',onclick:()=>{newIssue=false;render()}},'Abbrechen'))):
          h('button',{class:'btn',type:'button',style:'align-self:flex-start',onclick:()=>{newIssue=true;render()}},'Ausgabe anlegen'),
        h('p',{class:'hinweis-fuss'},'Die Reihenfolge in einer Ausgabe bestimmt die Reihenfolge im Newsletter. Textbausteine, Vorschau und Export folgen in den nächsten Stufen.'))),
    toastMsg?h('div',{class:'toast',role:'status'},toastMsg):null);
  const l2=document.querySelector('.liste');if(l2)l2.scrollTop=st;
  if(id){const e=document.getElementById(id);if(e){e.focus();try{if(pos!=null)e.setSelectionRange(pos,pos)}catch(_){}}}
}
render();
(async()=>{
  try{
    const user=await claude.use('user');canWrite=user?user.can('data.write'):null;
    db=await claude.use('db');
    if(!db){loaded=true;render();toast('Anmeldung nötig, um den Eingangskorb zu laden.');return}
    db.collection('quellen').onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render()},()=>{loaded=true;toast('Eingangskorb nicht ladbar.')});
    db.collection('ausgaben').onSnapshot(s=>{ausgaben=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.reihenfolge||0)-(y.reihenfolge||0));render()},()=>{});
  }catch(e){loaded=true;render()}
})();
</script>
