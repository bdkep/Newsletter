<title>Newsletter BdKEP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Gestaltung nach der Vorlage "Newsletter-Dashboard": Navy-Kopf, Kennzahlenleiste, links Eingangskorb, rechts die Ausgaben.
   Eckige Flächen mit 1-px-Rand, keine Schatten, Radius 2 px, Schaltflächen 44 px hoch. Nur helles Erscheinungsbild wie die Vorlage. */
:root{
  --navy:#002F6C; --gold:#D6A42E; --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1B2432; --muted:#566070; --line:#D5DAE1; --on-navy:#DCE6F2;
  --warn-bg:#FFF6DD; --warn-line:#D6A42E; --warn-ink:#4A3608; --crit-bg:#FBE9E7; --crit-line:#B3261E; --crit-ink:#7A1A14;
  --sans:'Open Sans',Arial,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:hover{filter:brightness(.9)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.page{max-width:1440px;margin:0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.kopf{background:var(--navy);color:#fff;padding-block:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.over{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
h1{margin:4px 0 0;font-size:30px;font-weight:800;line-height:1.2}
.sub{margin:8px 0 0;font-size:14px;color:var(--on-navy)}
.kopf img{display:block;height:56px;width:auto}
.kpis{display:flex;flex-wrap:wrap;gap:16px;padding-top:24px}
.kpi{flex:1 1 200px;background:var(--surface);border:1px solid var(--line);padding:16px 20px}
.kpi .v{font-size:32px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:24px 40px;align-items:flex-start}
.links{flex:1 1 640px;min-width:0;background:var(--surface);border:1px solid var(--line)}
.rechts{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.sec-head{padding:20px 24px;border-bottom:1px solid var(--line)}
.sec-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h2{margin:0;font-size:20px;font-weight:800;color:var(--navy)}
.muted{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{min-height:44px;padding:0 16px;border-radius:2px;font-size:14px;font-weight:600;background:var(--surface);color:var(--navy);border:1px solid var(--navy)}
.btn.on,.btn.primary{background:var(--navy);color:#fff}
.btn.danger{color:var(--crit-ink);border-color:var(--crit-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.abruf{margin-top:16px;padding:12px 16px;background:var(--bg);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px}
.abruf b{color:var(--navy);font-weight:700}
.liste{padding:20px 24px;display:flex;flex-direction:column;gap:12px;max-height:880px;overflow-y:auto}
article.k{border:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.zeile{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nr{font-size:12px;font-weight:700;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:2px 8px}
.k h3{margin:0;font-size:16px;font-weight:700;color:var(--navy);line-height:1.35;overflow-wrap:anywhere}
.k p{margin:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.warn{font-size:13px;line-height:1.45;padding:8px 12px}
.warn.warn-k{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
.warn.crit{background:var(--crit-bg);border:1px solid var(--crit-line);color:var(--crit-ink)}
.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.knoepfe{display:flex;flex-wrap:wrap;gap:8px}
pre.volltext{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);padding:10px 12px;font:13px/1.5 var(--sans);margin:0;max-height:360px;overflow:auto}
.feld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-height:44px;max-width:100%;width:100%}
textarea{min-height:96px;resize:vertical}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.raster .breit{grid-column:1/-1}
.formular{margin:20px 24px 0;padding:16px 20px;border:1px solid var(--navy);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.ausgabe{background:var(--surface);border:1px solid var(--line)}
.ausgabe .kopf2{background:var(--navy);color:#fff;padding:16px 24px}
.ausgabe h2{color:#fff;font-size:18px}
.ausgabe .kopf2 .muted{color:var(--on-navy);margin-top:4px}
.ausgabe .inhalt{padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.pos{border:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.pos .t{font-size:15px;font-weight:700;color:var(--navy);line-height:1.35;overflow-wrap:anywhere}
.leer{margin:0;font-size:14px;color:var(--muted)}
.hinweis-fuss{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.tb{border:1px solid var(--line);background:var(--bg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tb h4{margin:0;font-size:14px;font-weight:800;color:var(--navy)}
.tb .zahl{font-size:12px;color:var(--muted)}.tb .zahl.aus{color:var(--crit-ink);font-weight:700}
.tb details summary{cursor:pointer;font-size:13px;color:var(--navy);font-weight:600;min-height:32px;display:flex;align-items:center}
.tb .ver{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.senden{border:1px solid var(--gold);background:var(--warn-bg);padding:12px 14px;font-size:13px;line-height:1.5;color:var(--warn-ink);display:flex;flex-direction:column;gap:8px}
.senden ul{margin:0;padding-left:18px}
.tb-vorschau{font-size:14px;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;font-size:14px;max-width:90vw;border-left:4px solid var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:24px}
.tabs .person{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tabs .person select{width:auto;min-width:140px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;background:#E8EBEF;color:#2B3440}
.pill.neu{background:var(--navy);color:#fff}.pill.ok{background:#E1F1E9;color:#1E5A40}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}.pill.bad{background:var(--crit-bg);color:var(--crit-ink)}.pill.neutral{background:#E8EBEF;color:#566070}
article.k.fuer-mich{border-left:4px solid var(--gold)}
ul.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
ul.hist li{display:flex;flex-wrap:wrap;gap:4px 10px;overflow-wrap:anywhere}ul.hist .t{color:var(--muted);font-size:12px;min-width:16px}
.wliste{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
@media (max-width:520px){.sec-head,.liste,.ausgabe .inhalt{padding-left:16px;padding-right:16px}.formular{margin-left:16px;margin-right:16px}.ausgabe .kopf2{padding-left:16px;padding-right:16px}}
</style>
<div class="page" id="app"></div>
<script>
const LOGO_D='__LOGO_D__';
const SRC={mail:{l:'Mail',s:'background:#F6E7BF;color:#5A4310'},document:{l:'Datei',s:'background:#DCE6F2;color:#002F6C'},link:{l:'Web',s:'background:#E8EBEF;color:#2B3440'},note:{l:'Notiz',s:'background:#EDE6F2;color:#3B2A52'},image:{l:'Bild',s:'background:#E8EBEF;color:#2B3440'}};
const STATUS={vorschlag:'Vorschlag',kandidat:'Offener Kandidat',beobachtung:'Beobachtung'};
const RANK={vorschlag:0,kandidat:1,beobachtung:2};
const fmtD=new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Berlin'});
const fmtT=new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Europe/Berlin'});
const dat=(iso,t)=>{const d=new Date(iso);return isNaN(d)?'':(t?fmtT:fmtD).format(d)};
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='class')e.className=v;else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}

let db=null,canWrite=null,items=[],ausgaben=[],loaded=false,filter='alle',showNew=false,newTyp='note',newIssue=false,toastMsg='',toastT=0,busy=false;
const openIds=new Set(),delIds=new Set(),drafts={},askIds=new Set(),genBusy=new Set(),vorschlagIds=new Set();
let sample=null;
const WORDS=t=>((t||'').trim().match(/\S+/g)||[]).length;
const ZMIN=100,ZMAX=3000,ZSTD=450;
const zielOf=c=>{const z=parseInt(c&&c.zeichen,10);return z>=ZMIN&&z<=ZMAX?z:ZSTD};
/* Stilvorgaben wie style.md; die Beispiele zeigen nur Aufbau und Ton, aus ihnen werden keine Angaben übernommen */
const STIL_KOPF=`Du schreibst Kurztexte für den Newsletter des Bundesverbands der Kurier-Express-Post-Dienste (BdKEP), auf Deutsch, Anrede der Leser: Mitglieder, Verband spricht als "wir" nur, wenn die Quelle das so tut.
Regeln:
- sachlich, neutral, dauerhaft gültige Formulierungen; keine Werbesprache, keine wertenden Zusätze, keine rhetorischen Fragen, keine typischen KI-Formulierungen.
- Angaben ausschließlich aus der Quelle. Fehlt etwas, das für den Leser wichtig wäre (Datum, Ort, Frist, Link, Kontakt), schreibe an die Stelle [Angabe fehlt] und erfinde nichts.
- Überschrift: "Thema: Kernaussage" (oder bei Terminen "Datum – Veranstaltung"), höchstens 14 Wörter, ohne Punkt am Ende, ohne Nummer.
- Kurztext: ein bis zwei Absätze, Umfang siehe unten, mit konkreten Daten (Datum mit Wochentag, Uhrzeit, Beträge, Fristen), wenn die Quelle sie nennt.
- Nennt die Quelle einen Link, stelle ihn als reine URL ans Ende des Textes. Nennt sie eine Kontaktperson oder Kontaktdaten, füge eine Zeile "Kontakt: ..." an. Nennt sie keinen Link, aber einer wäre sinnvoll, schreibe "[Link einfügen]".
- Hinweise des Redakteurs sind nur zur Prüfung gedacht und kommen nicht in den Text.
`;
const STIL_BSP=`Beispiele für Aufbau und Ton (Inhalte nicht übernehmen):
Überschrift: Postgesetz: Kabinett beschließt Entwurf – Teilleistungen nicht mehr im Universaldienst
Kurztext: Das Bundeskabinett hat am 14.10. den Entwurf zur Änderung des Postgesetzes freigegeben. Teilleistungen gehören danach nicht mehr zu den Universaldienstleistungen. Damit werden sie voraussichtlich zum 1.1.2027 wieder mehrwertsteuerpflichtig. https://www.bundeswirtschaftsministerium.de/...
Überschrift: 28.10.2026 – 1. Münchner Radl-Logistik-Tag
Kurztext: Am Mittwoch, 28.10.2026, findet von 11:00 bis 15:00 Uhr der 1. Münchner Radl-Logistik-Tag statt. Veranstalter ist das B2B Lastenrad Zentrum München, Kooperationspartner sind unter anderem der BdKEP und das Mobilitätsreferat München. Im Mittelpunkt stehen gewerbliche Schwerlastenräder in der KEP- und Stadtlogistik. Schwerlastenräder und E-Vans stehen für Probefahrten bereit. [Link einfügen]
`;
const STIL_ENDE=z=>`Umfang: Der Kurztext hat etwa ${z} Zeichen einschließlich Leerzeichen und Link (zulässig ${Math.round(z*.9)} bis ${Math.round(z*1.1)}). Der Umfang ist verbindlich. Reichen die Angaben der Quelle für diesen Umfang nicht aus, fülle nicht mit Allgemeinplätzen auf, sondern frage nach.
Rückfragen: Reichen die Angaben der Quelle nicht für einen belastbaren Text (es fehlt z. B. das Thema selbst, Wer, Was, Wann oder die Kernaussage), schreibe keinen Text, sondern setze "status":"rueckfragen" und nenne in "rueckfragen" ein bis fünf konkrete, einzeln beantwortbare Fragen. Fehlen nur Nebenangaben, schreibe den Text mit [Angabe fehlt] und setze "status":"ok". Liegen ergänzende Angaben des Redakteurs vor, gelten sie wie die Quelle.
Antworte ausschließlich mit JSON: {"status":"ok","ueberschrift":"...","kurztext":"...","linkText":"","rueckfragen":[]}. Bei "rueckfragen" bleiben ueberschrift, kurztext und linkText leer. linkText ist der Text für eine Schaltfläche, z. B. "Zur Anmeldung", nur wenn ein Link vorhanden ist, sonst "".`;
const quellText=c=>[c.titel?'Titel der Quelle: '+c.titel:'',c.typ==='mail'&&c.mailBetreff?'Betreff der Mail: '+c.mailBetreff:'',c.url?'Link: '+c.url:'','Text der Quelle:\n'+(c.text||'(kein Text hinterlegt)'),c.ergaenzung?'Ergänzende Angaben des Redakteurs (wie Quelle verwenden):\n'+c.ergaenzung:'',c.hinweisText?'Hinweis des Redakteurs (nicht in den Text übernehmen): '+c.hinweisText:''].filter(Boolean).join('\n');
async function erzeugen(c,f){
  askIds.delete(c.id);
  if(!sample)return toast('Die Texterzeugung ist in dieser Ansicht nicht verfügbar. Der Text lässt sich von Hand schreiben.');
  const z=Math.min(ZMAX,Math.max(ZMIN,parseInt(f.z,10)||ZSTD)),erg=(f.e||'').trim();
  c={...c,zeichen:z,ergaenzung:erg};
  genBusy.add(c.id);render();
  try{
    const r=await sample(stilPrompt(z)+'\n\n--- Quelle ---\n'+quellText(c),{cache:false,modelTier:'default'});
    const m=String((r&&r.text)||'').match(/\{[\s\S]*\}/);const j=JSON.parse(m?m[0]:'');
    const fragen=(Array.isArray(j.rueckfragen)?j.rueckfragen:[]).map(x=>String(x||'').trim()).filter(Boolean).slice(0,5);
    const patch={zeichen:z,ergaenzung:erg,rueckfragen:j.status==='rueckfragen'&&fragen.length?fragen:[]};
    await db.doc('quellen/'+c.id).update(patch);
    if(patch.rueckfragen.length){delete drafts[c.id+'.e'];toast('Für einen Textvorschlag fehlen Angaben. Die Rückfragen stehen unter „Newsletter-Text“.',7000)}
    else{
      drafts[c.id+'.tu']=String(j.ueberschrift||'').trim();drafts[c.id+'.tk']=String(j.kurztext||'').trim();drafts[c.id+'.tl']=String(j.linkText||'').trim();
      vorschlagIds.add(c.id);toast('Vorschlag liegt vor. Bitte prüfen, anpassen und speichern.',5000);
    }
  }catch(e){toast(e&&e.code==='not_granted'?'Die Texterzeugung wurde nicht erlaubt.':'Kein Vorschlag erhalten. Bitte erneut versuchen oder von Hand schreiben.')}
  finally{genBusy.delete(c.id);render()}
}
async function textSpeichern(c,f){
  const t={ueberschrift:f.u.trim(),kurztext:f.k.trim(),linkText:f.l.trim(),durch:vorschlagIds.has(c.id)?'api':'manuell',am:new Date().toISOString(),freigegeben:false};
  if(!t.ueberschrift&&!t.kurztext)return toast('Bitte Überschrift oder Kurztext eintragen.');
  const ver=[...(c.tbVersionen||[]),...(c.tb?[c.tb]:[])].slice(-20);
  const ok=await upd(c,{tb:t,tbVersionen:ver},'Text gespeichert. Die Freigabe ist zurückgesetzt.');
  if(ok){['tu','tk','tl'].forEach(k=>delete drafts[c.id+'.'+k]);vorschlagIds.delete(c.id);render()}
}
const textFreigabe=(c,v)=>upd(c,{tb:{...c.tb,freigegeben:v}},v?'Text freigegeben.':'Freigabe zurückgenommen.');
const textZurueck=(c,i)=>{const ver=(c.tbVersionen||[]).slice(),w=ver.splice(i,1)[0];if(c.tb)ver.push(c.tb);return upd(c,{tb:{...w,freigegeben:false},tbVersionen:ver.slice(-20)},'Frühere Fassung wiederhergestellt, Freigabe zurückgesetzt.')};
function textPanel(c){
  const dk=(k,d)=>drafts[c.id+'.'+k]!==undefined?drafts[c.id+'.'+k]:d,tb=c.tb||{};
  const ziel=()=>Math.min(ZMAX,Math.max(ZMIN,parseInt(dk('z',zielOf(c)),10)||ZSTD)),zahlTxt=(n,z)=>n+' Zeichen, Ziel '+z+' (zulässig '+Math.round(z*.9)+' bis '+Math.round(z*1.1)+')',zahlAus=(n,z)=>n&&(n>z*1.1||n<z*.9);
  const mk=(k,v)=>e=>{drafts[c.id+'.'+k]=e.target.value;if(k==='tk'||k==='z'){const z=document.getElementById('z-'+c.id);if(z){const n=(dk('tk',tb.kurztext||'')).length;z.textContent=zahlTxt(n,ziel());z.className='zahl'+(zahlAus(n,ziel())?' aus':'')}}};
  const tu=h('input',{id:'tu-'+c.id,oninput:mk('tu')});tu.value=dk('tu',tb.ueberschrift||'');
  const tk=h('textarea',{id:'tk-'+c.id,style:'min-height:150px',oninput:mk('tk')});tk.value=dk('tk',tb.kurztext||'');
  const tl=h('input',{id:'tl-'+c.id,oninput:mk('tl'),placeholder:'z. B. Zur Anmeldung (nur mit Link)'});tl.value=dk('tl',tb.linkText||'');
  const n=tk.value.length,read=()=>({u:dk('tu',tb.ueberschrift||''),k:dk('tk',tb.kurztext||''),l:dk('tl',tb.linkText||'')});
  const w=h('div',{class:'tb'},h('div',{class:'zeile'},h('h4',{},'Newsletter-Text'),
    c.tb?h('span',{class:'badge',style:tb.freigegeben?'background:#E1F1E9;color:#1E5A40':'background:#FFF6DD;color:#4A3608'},tb.freigegeben?'Freigegeben':'Entwurf'):h('span',{class:'badge',style:'background:#E8EBEF;color:#2B3440'},'Noch kein Text'),
    c.tb?h('span',{class:'muted'},(tb.durch==='api'?'Vorschlag von Claude, bearbeitet':tb.durch==='archiv'?'aus dem Archiv übernommen':'von Hand')+' · '+dat(tb.am,true)):null));
  if(vorschlagIds.has(c.id))w.append(h('div',{class:'warn warn-k'},h('strong',{},'Vorschlag von Claude, noch nicht gespeichert.'),' Alle Angaben bitte mit der Quelle abgleichen. Stellen mit [Angabe fehlt] oder [Link einfügen] ergänzen.'));
  if(canWrite!==false){
    const zi=h('input',{id:'zi-'+c.id,type:'number',min:ZMIN,max:ZMAX,step:50,style:'max-width:120px',oninput:mk('z')});zi.value=dk('z',zielOf(c));
    const ze=h('textarea',{id:'te-'+c.id,style:'min-height:70px',oninput:mk('e'),placeholder:'Antworten auf Rückfragen, Termine, Links, Kontakt oder sonstige Angaben, die in der Quelle fehlen'});ze.value=dk('e',c.ergaenzung||'');
    w.append(h('div',{class:'zeile'},h('label',{class:'feld',style:'margin:0'},'Umfang des Textvorschlags (Zeichen)',zi),
      [300,500,800].map(v=>h('button',{class:'btn',type:'button',style:'min-height:36px',onclick:()=>{drafts[c.id+'.z']=String(v);render()}},v)),(()=>{const st=archivStat();return st&&st.zeichen?h('span',{class:'muted'},'Archiv: Abschnitte im Schnitt '+st.zeichen+' Zeichen'):null})()));
    if((c.rueckfragen||[]).length)w.append(h('div',{class:'warn warn-k'},h('strong',{},'Für einen Textvorschlag fehlen Angaben. Bitte klären:'),h('ul',{style:'margin:6px 0 0 18px;padding:0'},c.rueckfragen.map(q=>h('li',{},q))),h('div',{class:'muted',style:'margin-top:6px'},'Antworten unten bei „Ergänzende Angaben“ eintragen und den Vorschlag erneut erzeugen.')));
    w.append(h('label',{class:'feld'},'Ergänzende Angaben (gehen mit an Claude)',ze));
    if(askIds.has(c.id))w.append(h('div',{class:'senden'},h('strong',{},'Das wird an Claude gesendet:'),
      h('ul',{},h('li',{},'Titel und Text dieser Quelle ('+(c.text||'').length+' Zeichen)'),c.url?h('li',{},'der Link der Quelle'):null,c.typ==='mail'&&c.mailBetreff?h('li',{},'der Betreff der Mail'):null,c.hinweisText?h('li',{},'dein Hinweistext (nur zur Prüfung)'):null,c.ergaenzung||dk('e','')?h('li',{},'deine ergänzenden Angaben'):null,stilBeispiele(ziel()).length?h('li',{},'Stilbeispiele aus dem Archiv ('+stilBeispiele(ziel()).length+' Abschnitte bereits versendeter Newsletter)'):null),

"- Versandplan: Sammlung `ausgaben` mit `versanddatum` (JJJJ-MM-TT), `versandzeit` (optional), `notiz`, `status` (`planung`, `versendet`). Jede neue Ausgabe braucht einen Termin (Pflicht beim Anlegen, im Eingangskorb wie im Versandplan). Der Termin lässt sich im Versandplan und direkt in der Ausgabe ändern. Ausgaben stehen nach Termin aufsteigend, der späteste zuletzt, ohne Termin ganz am Ende (nur Bestand von vor der Pflicht). \"Als versendet ins Archiv\" geht nur mit freigegebenen Texten, legt `archiv/v-<Ausgabe-ID>` an und nimmt die Ausgabe aus Planung und Zuordnung. Gelöscht werden nur Ausgaben ohne Themen.\n"+
"- Archiv: Sammlung `archiv` mit bereits versendeten Newslettern (`name`, `versanddatum`, `abschnitte` mit Überschrift, Text, Link). Zweck: Aufbau, Ausdruck und Grammatik vereinheitlichen, auf ältere Meldungen verweisen, Abschnitte in neue Ausgaben übernehmen. Eine Übernahme legt eine Quelle mit Text im Entwurf an (nie freigegeben, mit Hinweis zur Aktualitätsprüfung). Als Stilvorbild markierte Newsletter gehen mit höchstens 3 Newslettern und 2 Abschnitten je Newsletter als Beispiele in den Claude-Vorschlag (steht in der Sendevorschau).\n"+
"- Dashboard: Reiter Eingangskorb, Versandplan, Archiv und Wünsche. Anmeldung durch Auswahl der Person (Andreas, Moritz). Schreibrechte hängen an der Stufe \"Contributor\". Gemeinsame Datenbank.\n"+
"- Datenschutz: Mails und Dokumente können vertrauliche oder personenbezogene Inhalte enthalten; keine echten Mails oder Quelltexte im Repo, Tests nur mit Testdaten.";
const LEITPLANKEN="- Zuerst `README.md`, `newsletter-dashboard-vorgabe.md` und `style.md` lesen, sie sind verbindlich.\n- Auf einem eigenen Branch arbeiten, nicht auf `main`. Keinen Pull Request öffnen und nichts veröffentlichen, bevor die Person es ausdrücklich sagt.\n- Zuerst eine kurze Einbauanalyse schreiben: welche Stellen betroffen sind, was bei bestehenden Daten ohne neue Felder passiert.\n- Nichts erfinden, keine Design-Werte erfinden (`design/` ist maßgeblich). Mails und Quelltexte nicht ins Repo schreiben.\n- Gmail nur lesen. Keine Texte automatisch freigeben, keine Daten ohne Klick an Claude senden.\n- Änderungen klein halten und nur die Dateien anfassen, die der Wunsch braucht.";
const mutateIn=async(col,id,fn,logText,okMsg)=>{
  if(!db){toast('Die Datenbank ist nicht erreichbar.');return false}
  if(!me){toast('Bitte oben zuerst "Ich bin …" wählen.');return false}
  if(busy)return false;busy=true;
  try{
    const ref=db.doc(col+'/'+id),snap=await ref.get();
    if(!snap.exists){toast(col==='aenderungen'?'Die Änderung existiert nicht mehr.':'Der Wunsch existiert nicht mehr.');return false}
    const cur=snap.data(),patch=fn(cur)||{};
    if(newForMe(cur)&&!('neuFuer' in patch))patch.neuFuer='';
    const verlauf=(cur.verlauf||[]).slice(-199);
    if(logText)verlauf.push({wer:me,wann:nowIso(),text:logText});
    await ref.update({...patch,verlauf,geaendert:nowIso(),geaendertVon:me});
    toast(okMsg?okMsg({...cur,...patch}):'Gespeichert.',okMsg?7000:3500);return true;
  }catch(e){if(e&&e.nutzer){toast(e.nutzer,8000);return false}toast('Speichern nicht möglich'+(e&&e.code==='invalid_argument'?': keine Schreibrechte.':'.'));return false}
  finally{busy=false}
};
const wm=(w,fn,log,ok)=>mutateIn('wuensche',w.id,fn,log,ok);
async function sampleJson(prompt,ctl){
  const r=await sample(prompt,{cache:false,modelTier:'default'});
  if(ctl&&ctl.aborted)throw {code:'cancelled'};
  const m=String((r&&r.text)||'').match(/\{[\s\S]*\}/);
  try{return JSON.parse(m?m[0]:'')}catch(e){throw {code:'invalid_json'}}
}

function vorgabeBauen(w,res,gek){
  const L=[];
  L.push('# Auftrag für Claude Code: Wunsch im Newsletter-Dashboard umsetzen','','Repo: bdkep/Newsletter','');
  L.push('## Wunsch','Von '+(w.von||'unbekannt')+', eingetragen '+fmt(w.angelegt)+'.',String(w.text||'').trim(),'');
  L.push('## User Story',w.story||'','');
  L.push('## Akzeptanzkriterien',...kriterienOf(w).map(k=>'- '+k),'');
  L.push('## Erfolgsmaß',w.erfolgsmass||'','');
  L.push('## Betroffene Abläufe');
  if(res.ablaeufe.length)res.ablaeufe.forEach(a=>L.push('- '+a.name+': '+a.beruehrt+(a.konflikt?' ACHTUNG, Konflikt mit einer Regel, vor der Umsetzung klären.':'')));
  else L.push('- Keine bestehenden Abläufe erkennbar berührt.');

  else L.push('- Keine Berührung mit anderen Wünschen erkannt.');

}
