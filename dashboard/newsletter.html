<title>Newsletter BdKEP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Gestaltung nach dem BdKEP Design System, gleiche Tokens wie Hub, Sekretariat und Aufgaben.
   Layout: eine Spalte, Bereichsreiter, Inbox mit Filterleiste und aufklappbaren Karten. */
:root{
  --navy-900:#001a3d; --navy-800:#00234f; --navy-700:#002f6c; --gold-500:#d6a42e; --gold-700:#8f6a12;
  --page:#ffffff; --bg:#f1f2f6; --surface:#ffffff;
  --fg:#16181f; --muted:#5a5f6d; --line:#e3e5ec; --line-strong:#c9ccd6; --heading:#002f6c;
  --accent:#002f6c; --accent-fg:#ffffff; --accent-soft:#e0e8f2; --gold:#d6a42e; --ring:#b8891f;
  --new-soft:#f9efd6; --ok:#2f7d5b; --ok-soft:#e1f1e9; --warn:#c77b1a; --warn-soft:#fbeedb; --bad:#b23a3a; --bad-soft:#f8e6e6;
  --r-sm:2px; --r-md:6px; --r-tag:4px;
  --shadow-sm:0 1px 3px rgba(0,26,61,.08); --shadow-md:0 4px 16px rgba(0,26,61,.10);
  --ease:cubic-bezier(.2,.7,.2,1); --dur:160ms;
  --sans:'Open Sans','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#001a3d; --bg:#001a3d; --surface:#00234f;
  --fg:#f1f2f6; --muted:#aab3c7; --line:#1d3d6b; --line-strong:#2f5287; --heading:#ffffff;
  --accent:#d6a42e; --accent-fg:#001a3d; --accent-soft:#0b3366; --ring:#d6a42e;
  --new-soft:#3a3010; --ok:#6cc38c; --ok-soft:#0f3a2c; --warn:#e0a24a; --warn-soft:#3a2a0e; --bad:#f08c86; --bad-soft:#3d1c26;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35); --shadow-md:0 4px 16px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#001a3d; --bg:#001a3d; --surface:#00234f;
  --fg:#f1f2f6; --muted:#aab3c7; --line:#1d3d6b; --line-strong:#2f5287; --heading:#ffffff;
  --accent:#d6a42e; --accent-fg:#001a3d; --accent-soft:#0b3366; --ring:#d6a42e;
  --new-soft:#3a3010; --ok:#6cc38c; --ok-soft:#0f3a2c; --warn:#e0a24a; --warn-soft:#3a2a0e; --bad:#f08c86; --bad-soft:#3d1c26;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35); --shadow-md:0 4px 16px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font:15px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;color:var(--heading)}
h2{font-size:15px;margin:0;font-weight:700;color:var(--heading)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.titel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.logo{display:inline-flex;flex:none}.logo img{display:block;height:32px;width:auto}.logo .logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .logo-l{display:none}:root:not([data-theme="light"]) .logo .logo-d{display:block}}
:root[data-theme="dark"] .logo .logo-l{display:none}:root[data-theme="dark"] .logo .logo-d{display:block}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav a,.nav span{display:inline-flex;align-items:center;min-height:30px;padding:4px 10px;border-radius:var(--r-sm);border:1px solid transparent;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.nav a:hover{border-color:var(--line-strong);color:var(--fg)}
.nav [aria-current]{background:var(--accent-soft);color:var(--heading);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 14px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color var(--dur) var(--ease)}
.tab:hover{color:var(--fg)}.tab[aria-selected="true"]{color:var(--heading);border-bottom-color:var(--gold)}
.tab .z{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:var(--r-sm);min-height:36px;font-weight:600;transition:border-color var(--dur) var(--ease),filter var(--dur) var(--ease)}
.btn:hover{border-color:var(--accent);filter:brightness(.95)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(.9)}
.btn.small{padding:4px 9px;min-height:30px;font-size:13px}.btn.danger{color:var(--bad)}.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:7px 9px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select{width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:flex;gap:6px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tag);padding:5px 12px}
.stat[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.stat .n{font-weight:700;font-variant-numeric:tabular-nums}.stat .l{font-size:13px;color:var(--muted)}
.search{flex:1 1 200px;min-width:0}.search input{width:100%}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.ist-neu{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.thead{cursor:pointer;border-radius:var(--r-md)}
.who{font-weight:700;overflow-wrap:anywhere}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-tag);background:var(--accent-soft);white-space:nowrap}
.pill.neu{background:var(--new-soft)}.pill.neutral{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.chev{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:14px;color:var(--muted);flex:none;transition:transform var(--dur) var(--ease)}
.chev.open{transform:rotate(90deg)}
.why{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.tr{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;font-size:14px;margin:0;font-family:var(--sans);max-height:420px;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.grid .wide{grid-column:1/-1}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--heading);font-size:16px;margin-bottom:4px}
.hint{background:var(--new-soft);border:1px solid var(--gold);border-radius:var(--r-md);padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy-900);color:#fff;padding:8px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow-md);font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap" id="app"></div>
<script>
const LOGO_L='data:image/png;base64,...',LOGO_D='data:image/png;base64,...'; /* Logos aus design/logo/ (kurz, kurz-invers) als data-URI einsetzen */
const TYP={mail:'Mail',note:'Notiz',link:'Link',document:'Dokument',image:'Bild'};
const BEREICHE=[['Hub','https://claude.ai/artifact/9NvHk49cBxBCQi4fNdYHG5'],['Sekretariat','https://claude.ai/artifact/WXgFEWhMBDvbRaVstvGar9'],['Aufgaben','https://claude.ai/artifact/S8qwDjDF1fB1oznUZUtp5s'],['Finanzcockpit','https://claude.ai/artifact/G7VeiVarANXmw5XDmva3Rz']];
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const fmtD=new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Europe/Berlin'});
const fmt=iso=>{const d=new Date(iso);return isNaN(d)?'':fmtD.format(d).replace(/\./,'')};
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='class')e.className=v;else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}

let db=null,canWrite=null,items=[],loaded=false,tab=store.get('tab')||'inbox',filter='alle',q='',showNew=false,toastMsg='',toastT=0,busy=false,newTyp='note';
const openIds=new Set(),delIds=new Set(),drafts={};
function toast(m,ms){toastMsg=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{toastMsg='';render()},ms||3500)}

async function anlegen(f){
  if(!db)return toast('Die Datenbank ist nicht erreichbar.');
  const titel=f.titel.trim(),text=f.text.trim();
  if(!titel&&!text&&!f.url)return toast('Bitte Titel, Text oder Link eintragen.');
  if(busy)return;busy=true;
  const id='h-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t=new Date().toISOString();
  const doc={typ:f.typ,titel:titel||(f.url||text.slice(0,60)),text,url:f.url||'',mailBetreff:f.betreff||'',mailAbsender:f.absender||'',mailDatum:f.datum||'',quelle:'hand',erfasstAm:t,erfasstVon:'Dashboard'};
  try{await db.doc('quellen/'+id).set(doc);showNew=false;drafts.neu=null;toast('Quelle liegt in der Inbox.')}
  catch(e){toast('Speichern nicht möglich'+(e&&e.code==='invalid_argument'?': keine Schreibrechte.':'.'))}
  finally{busy=false}
}
async function loeschen(c){
  if(!db||busy)return;busy=true;
  try{await db.doc('quellen/'+c.id).delete();delIds.delete(c.id);openIds.delete(c.id);toast('Quelle gelöscht.')}
  catch(e){toast('Löschen nicht möglich.')}finally{busy=false}
}
/* .eml und Textdateien im Browser lesen; docx, pdf und msg folgen per Textauszug (Stufe 2b) */
function parseEml(raw){
  const [head,...rest]=raw.replace(/\r\n/g,'\n').split('\n\n');
  const hd=n=>{const m=head.match(new RegExp('^'+n+':\\s*([^\\n]*(?:\\n[ \\t][^\\n]*)*)','im'));return m?m[1].replace(/\n\s+/g,' ').trim():''};
  return{betreff:hd('Subject'),absender:hd('From'),datum:hd('Date'),text:rest.join('\n\n').trim()};
}

function neuForm(){
  const dk=(k,d)=>drafts['neu.'+k]!==undefined?drafts['neu.'+k]:d;
  const set=k=>e=>{drafts['neu.'+k]=e.target.value};
  const mk=(id,lab,val,k,type)=>{const i=h('input',{id,type:type||'text',oninput:set(k)});i.value=dk(k,val||'');return h('label',{class:'f'},lab,i)};
  const ty=h('select',{id:'n-typ',onchange:e=>{newTyp=e.target.value;render()}},['note','link','mail','document'].map(k=>h('option',{value:k,selected:k===newTyp},TYP[k])));
  const ti=mk('n-titel','Titel',null,'t'),ur=mk('n-url','Adresse (URL)',null,'u','url');
  const be=mk('n-betreff','Betreff',null,'b'),ab=mk('n-abs','Absender',null,'a'),da=mk('n-datum','Datum der Mail',null,'d');
  const tx=h('textarea',{id:'n-text',oninput:set('x'),placeholder:newTyp==='mail'?'Mailtext einfügen':newTyp==='link'?'Kurze Beschreibung oder Haupttext (optional)':'Text'});tx.value=dk('x','');
  const file=h('input',{id:'n-file',type:'file',accept:'.txt,.md,.eml','aria-label':'Datei lesen',onchange:async e=>{
    const f=e.target.files[0];if(!f)return;const raw=await f.text();
    if(/\.eml$/i.test(f.name)){const m=parseEml(raw);drafts['neu.b']=m.betreff;drafts['neu.a']=m.absender;drafts['neu.d']=m.datum;drafts['neu.x']=m.text;drafts['neu.t']=m.betreff||f.name;newTyp='mail'}
    else{drafts['neu.x']=raw;drafts['neu.t']=f.name;newTyp='document'}render()}});
  const read=()=>({typ:newTyp,titel:dk('t',''),url:dk('u',''),betreff:dk('b',''),absender:dk('a',''),datum:dk('d',''),text:dk('x','')});
  return h('div',{class:'form'},h('h2',{},'Quelle erfassen'),
    h('div',{class:'grid'},h('label',{class:'f'},'Art',ty),ti,newTyp==='link'?ur:null,newTyp==='mail'?[be,ab,da]:null,
      h('label',{class:'f wide'},'Text',tx),h('label',{class:'f wide'},'Datei lesen (.txt, .md, .eml)',file)),
    h('div',{class:'actions'},h('button',{class:'btn primary',type:'button',onclick:()=>anlegen(read())},'In die Inbox legen'),
      h('button',{class:'btn',type:'button',onclick:()=>{showNew=false;render()}},'Abbrechen')));
}
function card(c){
  const isOpen=openIds.has(c.id),flip=()=>{isOpen?openIds.delete(c.id):openIds.add(c.id);render()};
  const el=h('div',{class:'card'+(c.quelle==='mail'&&!c.gesehen?' ist-neu':'')});
  el.append(h('div',{class:'row thead',role:'button',tabindex:'0','aria-expanded':String(isOpen),onclick:flip,
      onkeydown:e=>{if(e.target===e.currentTarget&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flip()}}},
    h('span',{class:'chev'+(isOpen?' open':''),'aria-hidden':'true'},'▸'),
    h('span',{class:'who'},c.titel||'Ohne Titel'),h('span',{class:'pill'},TYP[c.typ]||c.typ),
    c.quelle==='mail'?h('span',{class:'pill neutral'},'per Abruf'):null,
    h('span',{class:'time'},'erfasst '+fmt(c.erfasstAm))));
  if(!isOpen){const v=(c.text||'').replace(/\s+/g,' ').slice(0,160);if(v)el.append(h('p',{class:'why'},v+(c.text.length>160?' …':'')));return el}
  const meta=[c.mailAbsender?'Von '+c.mailAbsender:'',c.mailDatum?'am '+(fmt(c.mailDatum)||c.mailDatum):'',c.mailBetreff?'Betreff: '+c.mailBetreff:''].filter(Boolean).join(' · ');
  if(meta)el.append(h('p',{class:'why'},meta));
  if(c.url)el.append(h('a',{href:c.url,target:'_blank',rel:'noopener noreferrer',class:'why'},c.url));
  if(c.text)el.append(h('pre',{class:'tr'},c.text));
  if(canWrite!==false)el.append(h('div',{class:'actions'},delIds.has(c.id)?[
      h('button',{class:'btn small danger',type:'button',onclick:()=>loeschen(c)},'Wirklich löschen'),
      h('button',{class:'btn small',type:'button',onclick:()=>{delIds.delete(c.id);render()}},'Abbrechen')]:
    h('button',{class:'btn small',type:'button',onclick:()=>{delIds.add(c.id);render()}},'Löschen')));
  return el;
}
function inbox(){
  const n=k=>k==='alle'?items.length:items.filter(c=>c.typ===k).length;
  const needle=q.trim().toLowerCase();
  const list=items.filter(c=>filter==='alle'||c.typ===filter).filter(c=>!needle||[c.titel,c.text,c.mailBetreff,c.mailAbsender,c.url].join(' ').toLowerCase().includes(needle))
    .sort((a,b)=>(b.erfasstAm||'').localeCompare(a.erfasstAm||''));
  const si=h('input',{id:'suche',type:'search','aria-label':'Suchen',placeholder:'Suchen in Titel und Text',oninput:e=>{q=e.target.value;render();const i=document.getElementById('suche');if(i){i.focus();i.setSelectionRange(q.length,q.length)}}});si.value=q;
  return h('div',{class:'list'},
    h('div',{class:'hint'},'Mails an aschumann.bdkep+news@gmail.com werden täglich um 23:45 Uhr automatisch in die Inbox übernommen.'),
    h('div',{class:'bar'},
      h('div',{class:'stats',role:'group','aria-label':'Filter'},['alle','mail','note','link','document'].map(k=>
        h('button',{class:'stat',type:'button','aria-pressed':String(filter===k),onclick:()=>{filter=k;render()}},h('span',{class:'n'},n(k)),h('span',{class:'l'},k==='alle'?'Alle':TYP[k])))),
      canWrite===false?null:h('button',{class:'btn primary',type:'button',onclick:()=>{showNew=!showNew;render()}},'Quelle erfassen')),
    h('div',{class:'search'},si),
    showNew?neuForm():null,
    !loaded?h('div',{class:'empty'},'Lade Inbox …'):
    list.length?list.map(card):h('div',{class:'empty'},h('b',{},items.length?'Nichts gefunden':'Die Inbox ist leer'),items.length?'Filter oder Suche ändern.':'Erfasse eine Quelle oder warte auf den nächsten Mailabruf um 23:45 Uhr.'));
}
function platzhalter(t,txt){return h('div',{class:'empty'},h('b',{},t),txt)}
function render(){
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
  const app=document.getElementById('app');app.textContent='';
  app.append(h('header',{class:'top'},
    h('div',{class:'titel'},h('span',{class:'logo'},h('img',{class:'logo-l',src:LOGO_L,alt:'BdKEP',height:'32'}),h('img',{class:'logo-d',src:LOGO_D,alt:'',height:'32'})),h('h1',{},'Newsletter')),
    h('nav',{class:'nav','aria-label':'Dashboards'},BEREICHE.map(([n,u])=>h('a',{href:u,target:'_blank',rel:'noopener noreferrer'},n)),h('span',{'aria-current':'page'},'Newsletter'))),
    h('div',{class:'tabs',role:'tablist','aria-label':'Bereiche'},[['board','Board'],['inbox','Inbox'],['newsletter','Newsletter']].map(([k,l])=>
      h('button',{class:'tab',role:'tab',type:'button','aria-selected':String(tab===k),onclick:()=>{tab=k;store.set('tab',k);render()}},l,k==='inbox'?h('span',{class:'z'},String(items.length)):null))),
    tab==='inbox'?inbox():tab==='board'?platzhalter('Board folgt','Themenkarten, Ausgaben und Drag-and-Drop kommen in Stufe 3.'):platzhalter('Newsletter folgt','Textbausteine, Vorschau und Export kommen in Stufe 4 und 5.'),
    toastMsg?h('div',{class:'toast',role:'status'},toastMsg):null);
  if(id){const e=document.getElementById(id);if(e){e.focus();try{if(pos!=null)e.setSelectionRange(pos,pos)}catch(_){}}}
}
render();
(async()=>{
  try{
    const user=await claude.use('user');canWrite=user?user.can('data.write'):null;
    db=await claude.use('db');
    if(!db){loaded=true;toast('Anmeldung nötig, um die Inbox zu laden.');return}
    db.collection('quellen').onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render()},()=>{loaded=true;toast('Inbox nicht ladbar.')});
  }catch(e){loaded=true;render()}
})();
</script>
